[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-myochallenge"
version = "0.1.0"
description = "MyoChallenge environments and tasks in mjlab framework"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab",
    "myosuite",
    "numpy",
    "torch",
]
readme = "README.md"
authors = [
    {name = "mjlab_myochallenge contributors"}
]

[project.entry-points."mjlab.tasks"]
mjlab_myochallenge = "mjlab_myochallenge.tasks"

[project.scripts]
record = "mjlab_myochallenge.scripts.record:main"

[tool.ruff]
src = ["src/mjlab_myochallenge"]
indent-width = 4

[tool.uv.sources]
myosuite = { git = "https://github.com/MyoHub/myosuite.git", branch = "mjx" }

[tool.uv]
# Only here to defeat myosuite's stale `mujoco>=3.5,<3.6`, which nothing else can
# satisfy alongside mjlab. Mirrors mjlab's own range rather than picking one: an
# override replaces every constraint on the package, mjlab's included, so leaving
# the bounds off lets uv pick a mujoco mjlab rejects (3.6.0 and 3.11 both happened).
override-dependencies = [
    "mujoco~=3.10.0",
]

